[package]
name = "yetxn"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "yetxn"
path = "src/main.rs"

[dependencies]
ye-common = { path = "../common" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.29", features = ["user"] }