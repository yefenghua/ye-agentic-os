<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- /etc/dbus-1/system.d/org.yeos.Broker1.conf -->
<busconfig>
  <policy user="root">
      <allow own="org.yeos.Broker1"/>
      <allow send_destination="org.yeos.Broker1"/>
    </policy>
  <policy group="ai-agent">
    <allow send_destination="org.yeos.Broker1"/>
  </policy>
  <policy group="sudo">
    <allow send_destination="org.yeos.Broker1"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.yeos.Broker1"/>
  </policy>
</busconfig>